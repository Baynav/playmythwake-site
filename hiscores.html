<body>

<div class="frame">
  <a class="banner page-banner" href="./" aria-label="Mythwake home">
    <picture>
      <source srcset="img/hero-960.webp 960w, img/hero-1920.webp 1920w" sizes="(max-width: 1000px) 100vw, 1000px" type="image/webp">
      <img class="bg" src="img/hero-960.webp" alt="" width="960" height="540">
    </picture>
    <img class="logo" src="img/logo.webp" alt="Mythwake" width="900" height="205">

  <nav class="topnav" aria-label="Main">

<main id="main" class="single">
    <section class="box">
      <h1 class="box-title" id="hs-title">Hiscores</h1>
      <div class="box-body">
        <div class="hs">
          <nav class="hs-skills" id="hs-skills" aria-label="Skills"></nav>
          <div>
            <div class="hs-forms">
              <form id="hs-search-form">
                <label class="skip" for="hs-search">Player name</label>
                <input id="hs-search" type="search" placeholder="Search by player name" autocomplete="off">
                <button class="btn btn-small" type="submit">Search</button>
              </form>
              <form id="hs-rank-form">
                <label class="skip" for="hs-rank">Rank</label>
                <input id="hs-rank" type="number" min="1" placeholder="Go to rank">
                <button class="btn btn-small" type="submit">Go</button>
              </form>
            </div>
            <div id="hs-table-wrap">
              <table class="hs-table">
                <thead><tr><th>Rank</th><th>Name</th><th>Level</th><th>XP</th></tr></thead>
                <tbody id="hs-rows"></tbody>
              </table>
              <div class="hs-bar">
                <button class="btn btn-small" type="button" id="hs-prev">&laquo; Previous</button>
                <span class="small muted" id="hs-pageinfo"></span>
                <button class="btn btn-small" type="button" id="hs-next">Next &raquo;</button>
              </div>
            </div>
            <div id="hs-player" hidden></div>
            <p class="note muted" id="hs-updated"></p>
            <noscript><p class="hs-empty">The hiscores need JavaScript turned on.</p></noscript>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">

  </footer>
